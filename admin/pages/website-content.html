    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Bar -->
        <div class="topbar">
            <h1 class="page-title">Website Content Management</h1>
            <div class="user-menu">
                <button class="btn btn-primary me-3" onclick="previewWebsite()">

                <div class="dropdown">

                        <i class="fas fa-user-circle me-2"></i>Account
                    </button>

                        <li><a class="dropdown-item" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Content Sections -->
        <div class="row">
            <!-- Hero Section -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-star me-2"></i>Hero Section</h5>
                    </div>
                    <div class="card-body">
                        <form id="heroForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Main Title</label>
                                    <input type="text" class="form-control" id="heroTitle" placeholder="Main hero title">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Subtitle</label>
                                    <input type="text" class="form-control" id="heroSubtitle" placeholder="Hero subtitle">
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Description</label>
                                    <textarea class="form-control" rows="3" id="heroDescription" placeholder="Hero short description"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Primary Button Text</label>
                                    <input type="text" class="form-control" id="heroPrimaryBtn" placeholder="Primary button text">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Secondary Button Text</label>
                                    <input type="text" class="form-control" id="heroSecondaryBtn" placeholder="Secondary button text">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- About Section -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>About Section</h5>
                    </div>
                    <div class="card-body">
                        <form id="aboutForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Section Title</label>
                                    <input type="text" class="form-control" id="aboutTitle" placeholder="About section title">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Section Subtitle</label>
                                    <input type="text" class="form-control" id="aboutSubtitle" placeholder="About section subtitle">
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Main Description</label>
                                    <textarea class="form-control" rows="4" id="aboutDescription" placeholder="Main about description"></textarea>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Additional Description</label>
                                    <textarea class="form-control" rows="3" id="aboutAdditional" placeholder="Additional about description"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-phone me-2"></i>Contact Information</h5>
                    </div>
                    <div class="card-body">
                        <form id="contactForm">
                            <div class="mb-3">
                                <label class="form-label">Primary Phone</label>
                                <input type="tel" class="form-control" id="primaryPhone" placeholder="+250 781 393 649">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Secondary Phone</label>
                                <input type="tel" class="form-control" id="secondaryPhone" placeholder="+250 790 419 970">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="emailAddress" placeholder="powerflowservicesltd@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <input type="text" class="form-control" id="address" placeholder="Business address">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Website URL</label>
                                <input type="url" class="form-control" id="websiteUrl" placeholder="https://www.powerflowservices.com">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Social Media -->
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-share-alt me-2"></i>Social Media Links</h5>
                    </div>
                    <div class="card-body">
                        <form id="socialForm">
                            <div class="mb-3">
                                <label class="form-label">LinkedIn Profile</label>
                                <input type="url" class="form-control" id="linkedinUrl" placeholder="https://www.linkedin.com/...">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Facebook Page</label>
                                <input type="url" class="form-control" id="facebookUrl" placeholder="https://facebook.com/powerflowservices">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Twitter Profile</label>
                                <input type="url" class="form-control" id="twitterUrl" placeholder="https://twitter.com/powerflowservices">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Instagram Profile</label>
                                <input type="url" class="form-control" id="instagramUrl" placeholder="https://instagram.com/powerflowservices">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Save Changes
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- SEO Settings -->
            <div class="col-12 mb-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0"><i class="fas fa-search me-2"></i>SEO Settings</h5>
                    </div>
                    <div class="card-body">
                        <form id="seoForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Meta Title</label>
                                    <input type="text" class="form-control" id="metaTitle" placeholder="SEO meta title">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Meta Keywords</label>
                                    <input type="text" class="form-control" id="metaKeywords" placeholder="keyword1, keyword2, keyword3">
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label">Meta Description</label>
                                    <textarea class="form-control" rows="3" id="metaDescription" placeholder="SEO meta description"></textarea>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">

                            </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/admin-api-service.js"></script>
    <script src="../assets/js/admin-auth.js"></script>
    <script>
        const sectionFieldMap = {
            hero: {
                title: 'heroTitle',
                subtitle: 'heroSubtitle',
                description: 'heroDescription',
                primaryButtonText: 'heroPrimaryBtn',
                secondaryButtonText: 'heroSecondaryBtn',
            },
            about: {
                title: 'aboutTitle',
                subtitle: 'aboutSubtitle',
                description: 'aboutDescription',
                additionalDescription: 'aboutAdditional',
            },
            contact: {
                primaryPhone: 'primaryPhone',
                secondaryPhone: 'secondaryPhone',
                emailAddress: 'emailAddress',
                address: 'address',
                websiteUrl: 'websiteUrl',
            },
            social: {
                linkedinUrl: 'linkedinUrl',
                facebookUrl: 'facebookUrl',
                twitterUrl: 'twitterUrl',
                instagramUrl: 'instagramUrl',
            },
            seo: {
                metaTitle: 'metaTitle',
                metaKeywords: 'metaKeywords',
                metaDescription: 'metaDescription',
            },
        };

        function previewWebsite() {
            window.open('../../index.html', '_blank');
        }

        function setSectionValues(section, data = {}) {
            const fieldMap = sectionFieldMap[section] || {};
            Object.entries(fieldMap).forEach(([payloadKey, elementId]) => {
                const el = document.getElementById(elementId);
                if (!el) return;
                el.value = data[payloadKey] || '';
            });
        }

        function getSectionPayload(section) {
            const fieldMap = sectionFieldMap[section] || {};
            return Object.entries(fieldMap).reduce((payload, [payloadKey, elementId]) => {
                const el = document.getElementById(elementId);
                if (!el) return payload;
                payload[payloadKey] = (el.value || '').trim();
                return payload;
            }, {});
        }

        async function loadWebsiteContent() {
            try {
                const response = await adminAPIService.getWebsiteContent();
                if (!response.success || !response.data?.content) {
                    throw new Error(response.error?.message || 'Failed to load website content');
                }

                Object.keys(sectionFieldMap).forEach((section) => {
                    setSectionValues(section, response.data.content[section] || {});
                });
            } catch (error) {
                console.error('Error loading website content:', error);
                showAlert('Failed to load website content from backend.', 'danger');
            }
        }

        async function saveContent(form, section, successMessage) {
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            const payload = getSectionPayload(section);

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';
            submitBtn.disabled = true;

            try {
                const response = await adminAPIService.updateWebsiteContentSection(section, payload);
                if (!response.success || !response.data?.content) {
                    throw new Error(response.error?.message || 'Failed to save section');
                }

                setSectionValues(section, response.data.content[section] || {});
                showAlert(successMessage, 'success');
            } catch (error) {
                console.error(`Error saving ${section} content:`, error);
                showAlert(`Failed to update ${section} content.`, 'danger');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        }

        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
            alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; min-width: 300px;';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            document.body.appendChild(alertDiv);

            // Auto remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadWebsiteContent();

            document.getElementById('heroForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveContent(e.currentTarget, 'hero', 'Hero section updated successfully!');
            });

            document.getElementById('aboutForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveContent(e.currentTarget, 'about', 'About section updated successfully!');
            });

            document.getElementById('contactForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveContent(e.currentTarget, 'contact', 'Contact information updated successfully!');
            });

            document.getElementById('socialForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveContent(e.currentTarget, 'social', 'Social media links updated successfully!');
            });

            document.getElementById('seoForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                await saveContent(e.currentTarget, 'seo', 'SEO settings updated successfully!');
            });
        });
    </script>
</body>
